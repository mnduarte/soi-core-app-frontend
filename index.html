<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- El iPhone no lee los íconos del manifiesto: usa este y le aplica su
         propio redondeo. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` + los `env(safe-area-inset-*)` que ya usa el CSS:
         instalada, la app llega hasta el borde y no se le mete la barra de
         gestos encima de la navegación de abajo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2C4A9E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- El nombre debajo del ícono en la pantalla de inicio del iPhone. -->
    <meta name="apple-mobile-web-app-title" content="SOI" />
    <title>SOI — Gestión odontológica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Work+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
